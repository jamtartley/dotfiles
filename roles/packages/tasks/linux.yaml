---
- name: Upgrade all repository packages
  community.general.pacman:
    update_cache: true
    upgrade: true
  become: yes

- name: Install pacman packages from the list
  ansible.builtin.package:
    name: "{{ lookup('file', 'pacman_packages').split('\n') }}"
    state: present
  become: yes

- name: Install or update yay packages from the list
  kewlfft.aur.aur:
    name: "{{ lookup('template', 'yay_packages.j2').split('\n') }}"
    state: latest
    use: yay
