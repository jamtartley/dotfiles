---
- name: Link pacman.conf
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/pacman/files/pacman.conf"
    dest: "/etc/pacman.conf"
    state: link
    force: true
  become: yes

- name: Link mirrorlist
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/pacman/files/mirrorlist"
    dest: "/etc/pacman.d/mirrorlist"
    state: link
    force: true
  become: yes
